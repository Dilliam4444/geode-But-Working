name: Package Seagull 2.209 Source

on:
  push:
    branches:
      - no-build-seagull-v6-2209
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        shell: bash
        run: |
          git archive --format=zip --output=Geode-2.209-Source.zip HEAD
          sha256sum Geode-2.209-Source.zip > Geode-2.209-Source.sha256

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Geode-2.209-Source
          path: |
            Geode-2.209-Source.zip
            Geode-2.209-Source.sha256
