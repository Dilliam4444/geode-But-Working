name: Seagull Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - no-build-seagull-2.2091

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache
  base-configure-command: >-
    cmake -B build
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja"
    -G Ninja

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup caches
        uses: ./.github/actions/setup-cache
        with:
          host: linux
          target: win
          use-ccache: true

      - name: Setup Ninja
        uses: ./.github/actions/setup-ninja
        with:
          host: linux

      - name: Setup CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Download xwin
        uses: robinraju/release-downloader@v1.10
        with:
          repository: Jake-Shadle/xwin
          latest: true
          fileName: 'xwin-*-x86_64-unknown-linux-musl.tar.gz'
          tarBall: false
          zipBall: false
          out-file-path: "epic-xwin"

      - name: Prepare xwin
        run: |
          tar -xzf epic-xwin/xwin-*-x86_64-unknown-linux-musl.tar.gz -C epic-xwin
          mv epic-xwin/xwin-*-x86_64-unknown-linux-musl/xwin ./xwin
          ./xwin --arch x86_64 --sdk-version 10.0.22621 --accept-license list

      - name: Setup xwin cache
        id: xwin-cache
        uses: actions/cache@v4
        with:
          path: .xwin-cache
          key: xwin-win-v1-${{ hashFiles('.xwin-cache/**/*') }}

      - name: Download Windows headers
        run: ./xwin --arch x86_64 --sdk-version 10.0.26100 --accept-license splat --include-debug-libs
        if: steps.xwin-cache.outputs.cache-hit != 'true'

      - name: Download clang-msvc-sdk toolchain
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/clang-msvc-sdk
          path: toolchain
          submodules: recursive

      - name: Install Clang 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg zip
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all

      - name: Add LLVM 21 to path
        run: echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Configure
        run: >
          ${{ env.base-configure-command }}
          -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          -DGEODE_UNITY_BUILD=ON
        env:
          SPLAT_DIR: ${{ github.workspace }}/.xwin-cache/splat
          TOOLCHAIN: ${{ github.workspace }}/toolchain/clang-cl-msvc.cmake
          HOST_ARCH: x86_64

      - name: Build
        run: |
          cmake --build build --config RelWithDebInfo --parallel
          rm -f bin/nightly/resources/.geode_cache

      - name: Package ready-to-use Windows build
        run: |
          cd bin/nightly
          zip -r ../../geode-seagull-win.zip .

      - name: Package source snapshot
        run: |
          mkdir -p package-source
          rsync -a --exclude '.git' --exclude 'build' --exclude 'package-source' --exclude 'geode-seagull-win.zip' ./ package-source/
          zip -qr geode-seagull-source.zip package-source

      - name: Upload ready-to-use Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: geode-seagull-win
          path: geode-seagull-win.zip

      - name: Upload buildable source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: geode-seagull-source
          path: geode-seagull-source.zip
